technical_notes: |
  Backend detection: platform.system() == "Darwin" → mlx; torch.cuda.is_available() → cuda.
  Ollama API: POST /api/generate with {"model", "prompt", "images": [b64], "stream": false}.
  Moondream2 native input: 378x378 px.
  GGUF quantization: q4_K_M via llama.cpp convert_hf_to_gguf.py + llama-quantize.
  All async — no time.sleep() in the agent loop, no blocking HTTP calls.

